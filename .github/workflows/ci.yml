name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - beta
      - next

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cgo: "1"
          - os: windows-latest
            cgo: "0"
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install Linux FUSE headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev

      - name: Run tests
        run: go test ./...

  native:
    name: Native Linux build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install Linux FUSE headers
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev

      - name: Vet
        run: go vet ./...

      - name: Race-test stateful packages
        run: >-
          go test -race
          ./internal/config
          ./internal/buffer
          ./pkg/server
          ./pkg/manager
          ./cmd/decypharr

      - name: Build native binary
        run: |
          mkdir -p dist
          go build -trimpath -o dist/decypharr .

      - name: Smoke-test command line
        run: ./dist/decypharr --help

  frontend:
    name: Browser assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit build dependencies
        run: npm audit --audit-level=high

      - name: Build assets
        run: npm run build

      - name: Verify generated assets are current
        run: git diff --exit-code -- pkg/server/assets/build
