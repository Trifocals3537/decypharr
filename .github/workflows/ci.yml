name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - beta
      - next

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cgo: "1"
          - os: windows-latest
            cgo: "0"
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux FUSE headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev

      - name: Run tests
        run: go test ./...

  native:
    name: Native Linux build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux FUSE headers
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev

      - name: Vet
        run: go vet ./...

      - name: Race-test configuration paths
        run: go test -race ./internal/config ./pkg/server

      - name: Build native binary
        run: go build -trimpath -o dist/decypharr .

      - name: Smoke-test command line
        run: ./dist/decypharr --help

  frontend:
    name: Browser assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit build dependencies
        run: npm audit --audit-level=high

      - name: Build assets
        run: npm run build

      - name: Verify generated assets are current
        run: git diff --exit-code -- pkg/server/assets/build
