name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/trifocals3537/decypharr
  LDFLAGS_PKG: github.com/sirrobot01/decypharr/pkg/version

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      channel: ${{ steps.metadata.outputs.channel }}
    steps:
      - name: Extract version and channel
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF#refs/tags/}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-(beta|rc)(\.[0-9]+)?)?$ ]]; then
            echo "Unsupported release tag: ${tag}" >&2
            echo "Expected vMAJOR.MINOR[.PATCH], optionally followed by -beta[.N] or -rc[.N]" >&2
            exit 1
          fi
          version="${tag#v}"

          case "${version}" in
            *-beta*)
              channel=beta
              ;;
            *-rc*)
              channel=rc
              ;;
            *)
              channel=stable
              ;;
          esac

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"

  build-linux:
    name: Linux ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            label: x86_64
            zig_target: x86_64-linux-gnu.2.17
            machine_pattern: x86-64
          - arch: arm64
            label: arm64
            zig_target: aarch64-linux-gnu.2.17
            machine_pattern: ARM aarch64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y binutils file libfuse-dev

      - name: Build
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CC: zig cc -target ${{ matrix.zig_target }}
          CXX: zig c++ -target ${{ matrix.zig_target }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X ${LDFLAGS_PKG}.Version=${VERSION} -X ${LDFLAGS_PKG}.Channel=${CHANNEL}" \
            -o dist/decypharr

      - name: Verify architecture and glibc baseline
        env:
          EXPECTED_MACHINE: ${{ matrix.machine_pattern }}
        run: |
          set -euo pipefail

          file dist/decypharr
          file dist/decypharr | grep -F "${EXPECTED_MACHINE}"

          max_glibc="$(
            readelf --version-info dist/decypharr |
              grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' |
              sort -Vu |
              tail -n 1 || true
          )"

          if [[ -z "${max_glibc}" ]]; then
            echo "No glibc version requirements were found" >&2
            exit 1
          fi

          if [[ "$(printf '%s\n' "${max_glibc}" "GLIBC_2.17" | sort -V | tail -n 1)" != "GLIBC_2.17" ]]; then
            echo "Binary requires ${max_glibc}, newer than the GLIBC_2.17 baseline" >&2
            exit 1
          fi

          echo "Maximum glibc requirement: ${max_glibc}"

      - name: Smoke-test on Ubuntu 20.04
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm \
            --volume "${PWD}/dist:/work:ro" \
            ubuntu:20.04 \
            bash -euc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates libfuse2
              /work/decypharr --help
            '

      - name: Package
        run: |
          set -euo pipefail
          install -m 0644 packaging/systemd/decypharr.service dist/decypharr.service
          install -m 0644 LICENSE dist/LICENSE
          tar czf "dist/decypharr_Linux_${{ matrix.label }}.tar.gz" \
            -C dist decypharr decypharr.service LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/decypharr_Linux_*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Windows x86_64
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X ${LDFLAGS_PKG}.Version=${VERSION} -X ${LDFLAGS_PKG}.Channel=${CHANNEL}" \
            -o dist/decypharr.exe
          install -m 0644 LICENSE dist/LICENSE

      - name: Verify architecture
        run: |
          set -euo pipefail
          file dist/decypharr.exe
          file dist/decypharr.exe | grep -F "x86-64"

      - name: Package
        working-directory: dist
        run: zip decypharr_Windows_x86_64.zip decypharr.exe LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-amd64
          path: dist/decypharr_Windows_x86_64.zip
          if-no-files-found: error
          retention-days: 7

  build-darwin:
    name: macOS ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            label: x86_64
            runner: macos-15-intel
            expected_arch: x86_64
          - arch: arm64
            label: arm64
            runner: macos-15
            expected_arch: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install macFUSE headers
        run: brew install macfuse

      - name: Build
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X ${LDFLAGS_PKG}.Version=${VERSION} -X ${LDFLAGS_PKG}.Channel=${CHANNEL}" \
            -o dist/decypharr
          install -m 0644 LICENSE dist/LICENSE

      - name: Verify architecture and command line
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          set -euo pipefail
          file dist/decypharr
          test "$(lipo -archs dist/decypharr)" = "${EXPECTED_ARCH}"
          ./dist/decypharr --help

      - name: Package
        run: >-
          tar czf "dist/decypharr_Darwin_${{ matrix.label }}.tar.gz"
          -C dist decypharr LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: darwin-${{ matrix.arch }}
          path: dist/decypharr_Darwin_*.tar.gz
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Publish container image
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.channel }},enable=${{ needs.prepare.outputs.channel != 'stable' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.channel == 'stable' }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            CHANNEL=${{ needs.prepare.outputs.channel }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
          provenance: mode=max
          sbom: true

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-linux
      - build-windows
      - build-darwin
      - docker
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: "!*.dockerbuild"
          merge-multiple: true

      - name: Generate release checksums
        working-directory: dist
        run: sha256sum ./* > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail

          release_args=(
            --title "decypharr ${TAG}"
            --generate-notes
            --verify-tag
          )

          if [[ "${CHANNEL}" != "stable" ]]; then
            release_args+=(--prerelease)
          fi

          previous_tag="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [[ -n "${previous_tag}" ]]; then
            release_args+=(--notes-start-tag "${previous_tag}")
          fi

          gh release create "${TAG}" dist/* "${release_args[@]}"
